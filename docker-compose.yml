services:
  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional Redis GUI for visual inspection of cache keys & metrics
  redis-insight:
    image: redis/redis-insight:latest
    container_name: marketplace_redis_insight
    restart: unless-stopped
    ports:
      - '5540:5540'
    environment:
      - REDIS_HOSTS=redis:6379
    depends_on:
      - redis
    profiles:
      - debug

volumes:
  redis_data:
    driver: local
